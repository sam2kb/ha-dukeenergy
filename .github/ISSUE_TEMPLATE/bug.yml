name: Bug report
description: Report a problem with the Duke Energy integration
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before opening a report. Do not post passwords,
        tokens or callback URLs. Review diagnostics and logs for personal details.
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.2.3"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Duke Energy integration version
      description: Shown in HACS or the integration manifest.json.
    validations:
      required: true
  - type: dropdown
    id: service_type
    attributes:
      label: Service affected
      options:
        - Electricity
        - Gas
        - Both
        - Sign-in or setup
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the error, what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        When available, attach the file from Settings > Devices & services >
        Duke Energy > menu > Download diagnostics. If setup failed before this
        became available, say so here.
  - type: textarea
    id: logs
    attributes:
      label: Relevant debug log excerpt
      description: |
        Enable debug logging from the integration menu, reproduce the problem,
        then disable it to download the log. Share the relevant excerpt after
        removing tokens, callback URLs, account numbers and addresses.
      render: text
