name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    name: "Verify release version"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check tag matches manifest version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          tag = os.environ["TAG"].removeprefix("v")
          manifest = pathlib.Path(
              "custom_components/duke_energy/manifest.json"
          )
          version = json.loads(manifest.read_text())["version"]
          print(f"tag={tag} manifest={version}")
          sys.exit(0 if tag == version else "manifest version does not match tag")
          PY
