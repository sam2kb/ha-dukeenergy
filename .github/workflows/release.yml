name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    name: "Verify release version"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check project, manifest, and release versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import tomllib

          tag = os.environ["TAG"].removeprefix("v")
          manifest = pathlib.Path(
              "custom_components/duke_energy/manifest.json"
          )
          version = json.loads(manifest.read_text())["version"]
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          project_version = project["project"]["version"]
          print(f"tag={tag or '(manual check)'} manifest={version} project={project_version}")
          if project_version != version:
              sys.exit("project version does not match manifest")
          if tag and tag != version:
              sys.exit("manifest version does not match tag")
          PY
