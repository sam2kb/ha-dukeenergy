name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python3 -m pip install ruff==0.15.16

      - name: Lint integration
        run: python3 -m ruff check custom_components scripts

      - name: Lint tests
        run: python3 -m ruff check tests --select F

      - name: Format
        run: python3 -m ruff format . --check
